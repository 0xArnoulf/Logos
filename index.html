<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Logos</title>
	<meta name="author" content="Arnoulf#0348">
	<style>
		@font-face { font-family: "Alegreya"; font-weight: 500; font-display: block; src: url("fonts/alegreya-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
		@font-face { font-family: "Alegreya"; font-weight: 500; font-display: block; src: url("fonts/alegreya-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
		@font-face { font-family: "Alegreya"; font-weight: 500; font-display: block; src: url("fonts/alegreya-greek-500-normal.woff2") format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }
		@font-face { font-family: "Alegreya"; font-weight: 500; font-display: block; src: url("fonts/alegreya-greek-ext-500-normal.woff2") format("woff2"); unicode-range: U+1F00-1FFF; }
		@font-face { font-family: "Alegreya SC"; font-weight: 500; font-display: block; src: url("fonts/alegreya-sc-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
		@font-face { font-family: "Alegreya SC"; font-weight: 500; font-display: block; src: url("fonts/alegreya-sc-latin-ext-500-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
		@font-face { font-family: "Alegreya SC"; font-weight: 500; font-display: block; src: url("fonts/alegreya-sc-greek-500-normal.woff2") format("woff2"); unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF; }

		/* Two inks per theme: the field and gold. Everything is drawn in them. */
		:root {
			--gold: #e8c66a;
			--gold-dim: #c9a755;
			--field: #5c1520;
			--grout: #2a0910;
		}
		body[data-lang="grc"] {
			--gold-dim: #bfa35e;
			--field: #18255a;
			--grout: #090f2e;
		}

		html, body {
			margin: 0;
			background: var(--grout);
		}
		body {
			width: 320px;
			height: 300px;
			overflow: hidden;
			color: var(--gold);
			font-family: "Alegreya SC", serif;
			font-weight: 500;
			-webkit-font-smoothing: antialiased;
		}
		::selection {
			background: var(--gold);
			color: var(--field);
		}

		.panel {
			position: relative;
			width: 320px;
			height: 300px;
		}
		.panel canvas {
			position: absolute;
			inset: 0;
			width: 320px;
			height: 300px;
		}

		/* The Ω medallion set into the top border band */
		.emblem {
			position: absolute;
			top: 0;
			left: 50%;
			width: 46px;
			height: 46px;
			margin-left: -23px;
			display: grid;
			place-items: center;
			font-size: 23px;
			line-height: 1;
			padding-top: 1px;
			text-shadow: 0 1px 1px rgb(0 0 0 / 0.55);
			user-select: none;
		}

		.locution {
			position: absolute;
			top: 58px;
			left: 32px;
			right: 32px;
			height: 168px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			overflow: hidden;
		}
		.locution > div {
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		.phrase {
			margin: 0;
			font-size: 36px;
			line-height: 1.12;
			letter-spacing: 0.03em;
			text-wrap: balance;
			text-shadow: 0 1px 1px rgb(0 0 0 / 0.55), 0 2px 8px rgb(0 0 0 / 0.25);
		}
		.greek {
			margin: 0;
			font-family: "Alegreya", serif;
			font-size: 42px;
			line-height: 1.1;
			text-shadow: 0 1px 1px rgb(0 0 0 / 0.55), 0 2px 8px rgb(0 0 0 / 0.25);
		}
		.greek[hidden] {
			display: none;
		}
		body[data-lang="grc"] .phrase {
			margin-top: 10px;
			font-size: 16px;
			letter-spacing: 0.14em;
			color: var(--gold-dim);
		}

		.colophon {
			position: absolute;
			left: 32px;
			right: 32px;
			bottom: 34px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			font-size: 14px;
			letter-spacing: 0.1em;
			text-shadow: 0 1px 1px rgb(0 0 0 / 0.5);
		}
		.language {
			color: var(--gold-dim);
		}
		/* A single gold tessera as the separator */
		.tessera {
			width: 4px;
			height: 4px;
			background: var(--gold-dim);
			transform: rotate(45deg);
		}
		.tessera[hidden] {
			display: none;
		}
		.colophon a {
			color: var(--gold);
			text-decoration: underline;
			text-decoration-thickness: 1px;
			text-underline-offset: 4px;
			text-decoration-color: color-mix(in srgb, var(--gold) 55%, transparent);
			border-radius: 2px;
			transition: text-decoration-color 0.2s ease-out, color 0.2s ease-out;
		}
		.colophon a:hover {
			color: #f6dc93;
			text-decoration-color: currentColor;
		}
		.colophon a:focus-visible {
			outline: 1px solid var(--gold);
			outline-offset: 4px;
		}
		.colophon a[hidden] {
			display: none;
		}
	</style>
</head>
<body data-lang="la">
	<main class="panel">
		<canvas id="mosaic" aria-hidden="true"></canvas>
		<div class="emblem" aria-hidden="true">Ω</div>

		<div class="locution" id="locution">
			<div>
				<p class="greek" id="greek" lang="grc" hidden></p>
				<p class="phrase" id="phrase" lang="la"></p>
			</div>
		</div>

		<footer class="colophon">
			<span class="language" id="language">Latin</span>
			<span class="tessera" id="separator" aria-hidden="true"></span>
			<a id="link" href="#" target="_blank" rel="noopener noreferrer">Wikipedia</a>
		</footer>
	</main>

	<script src="mosaic.js"></script>
	<script src="popup.js"></script>
</body>
</html>
