<!DOCTYPE html>
<html lang="la">
<head>
	<meta charset="utf-8">
	<title>Logos</title>
	<meta name="author" content="Arnoulf#0348">
	<style>
		body {
			width: 320px;
			min-height: 140px;
			margin: 0;
			padding: 24px 16px;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			justify-content: center;
			background: rgb(2, 0, 36);
			background: radial-gradient(circle, rgba(2, 0, 36, 1) 0%, rgba(221, 21, 21, 1) 82%, rgba(255, 0, 5, 1) 100%);
			color: white;
			font-family: serif;
			text-align: center;
		}
		#dynamic-text {
			margin: 0 0 16px;
			font-size: 1.3rem;
			font-style: italic;
			line-height: 1.35;
		}
		#dynamic-link {
			color: white;
			text-decoration: none;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
			font-size: 0.8rem;
			opacity: 0.85;
		}
		#dynamic-link:hover,
		#dynamic-link:focus-visible {
			text-decoration: underline;
			opacity: 1;
		}
		#dynamic-link[hidden] {
			display: none;
		}
	</style>
</head>
<body>
	<div id="dynamic-content">
		<p id="dynamic-text"></p>
		<a id="dynamic-link" href="#" target="_blank" rel="noopener noreferrer" lang="en">Click here to get more context</a>
	</div>

	<script src="popup.js"></script>
</body>
</html>
